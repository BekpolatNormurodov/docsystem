# Main Nginx config (mounted over /etc/nginx/nginx.conf). The edge terminates TLS for all three
# domains and reverse-proxies to the single Next.js app (web:5200) — the routes are NOT physically
# separable by path prefix, so every subdomain reaches the same upstream. Per-domain behaviour lives in
# conf.d/*.conf; repeated proxy/SSL directives live in snippets/*.conf.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" host=$host rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Excel portfolio imports and scanned court PDFs are large; give uploads generous headroom.
    client_max_body_size 200M;
    client_body_timeout  300s;

    # gzip text responses (HTML/JSON/JS/CSS). PDFs/ZIPs/xlsx are already compressed — don't re-deflate.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml application/xml+rss
                      text/javascript image/svg+xml;

    # Docker's embedded DNS. NOTE: the static `server web:5200` upstream below is resolved ONCE at
    # config load — if the web container is recreated with a new IP, reload nginx (update.sh does this
    # automatically; manually: docker compose --env-file .env.production exec nginx nginx -s reload).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # websocket/upgrade passthrough (used by Next dev HMR; harmless in prod, kept for correctness).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Single upstream: the Next.js web container. keepalive reuses connections for lower latency.
    upstream docsystem_web {
        server web:5200;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
