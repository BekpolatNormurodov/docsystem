# ─────────────────────────────────────────────────────────────────────────────
#  HOST nginx config — use this when the server ALREADY runs a host-level nginx in
#  front (instead of the docsystem `nginx`+`certbot` containers). The docsystem web
#  container is published on 127.0.0.1:5200 and this host nginx terminates TLS and
#  reverse-proxies the 3 domains to it.
#
#  Install:
#    1) Publish the web container on localhost — see docker-compose.override.yml note below.
#    2) sudo cp host-nginx.example.conf /etc/nginx/conf.d/yuristsystem.conf
#    3) sudo nginx -t && sudo systemctl reload nginx
#    4) sudo apt install -y certbot python3-certbot-nginx
#    5) sudo certbot --nginx -d yuristsystem.uz -d www.yuristsystem.uz \
#             -d dashboard.yuristsystem.uz -d api.yuristsystem.uz
#       → certbot auto-adds the :443 SSL blocks + HTTP→HTTPS redirect to each server below,
#         and auto-renews. Done.
# ─────────────────────────────────────────────────────────────────────────────

upstream docsystem_app { server 127.0.0.1:5200; keepalive 32; }

map $http_upgrade $docsystem_conn_up { default upgrade; '' close; }

# CORS: reflect Origin only for *.yuristsystem.uz (api host).
map $http_origin $docsystem_cors { default ""; "~^https://([a-z0-9-]+\.)?yuristsystem\.uz$" $http_origin; }

# Reusable proxy directives are repeated inline per server (host nginx has no shared snippet here).
# ── apex: yuristsystem.uz ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yuristsystem.uz;
    client_max_body_size 200M;

    location /_next/static/ {
        proxy_pass http://docsystem_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        proxy_pass http://docsystem_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $docsystem_conn_up;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}

# ── www → apex ───────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.yuristsystem.uz;
    return 301 https://yuristsystem.uz$request_uri;
}

# ── dashboard.yuristsystem.uz (lands on /konveyer) ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.yuristsystem.uz;
    client_max_body_size 200M;

    location = / { return 302 /konveyer; }
    location / {
        proxy_pass http://docsystem_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $docsystem_conn_up;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}

# ── api.yuristsystem.uz (CORS for *.yuristsystem.uz) ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.yuristsystem.uz;
    client_max_body_size 200M;

    location / {
        add_header Access-Control-Allow-Origin      $docsystem_cors always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
        add_header Vary                             "Origin" always;
        if ($request_method = OPTIONS) { add_header Content-Length 0; return 204; }

        proxy_pass http://docsystem_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
