# dashboard.yuristsystem.uz — same app, but its landing page is the Konveyer dashboard instead of the
# app's default `/` -> `/hujjatlar` redirect. Only the bare `/` is rerouted; every other path proxies
# through unchanged, so deep links keep working. Auth is shared via the domain-wide cookie
# (COOKIE_DOMAIN=.yuristsystem.uz), so a login on any subdomain is valid here too.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name dashboard.yuristsystem.uz;

    ssl_certificate     /etc/letsencrypt/live/yuristsystem.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuristsystem.uz/privkey.pem;
    include             /etc/nginx/snippets/ssl.conf;

    # Land the dashboard host straight on the Konveyer board.
    location = / {
        return 302 /konveyer;
    }

    location /_next/static/ {
        proxy_pass http://docsystem_web;
        include    /etc/nginx/snippets/proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://docsystem_web;
        include    /etc/nginx/snippets/proxy.conf;
    }
}
