# yuristsystem.uz — the primary application origin. www.* redirects here. One SAN certificate
# (live/yuristsystem.uz) covers all four hostnames; every :443 server references the same files.

# www.yuristsystem.uz -> apex (kept as its own server so the redirect is unambiguous).
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.yuristsystem.uz;

    ssl_certificate     /etc/letsencrypt/live/yuristsystem.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuristsystem.uz/privkey.pem;
    include             /etc/nginx/snippets/ssl.conf;

    return 301 https://yuristsystem.uz$request_uri;
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name yuristsystem.uz;

    ssl_certificate     /etc/letsencrypt/live/yuristsystem.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuristsystem.uz/privkey.pem;
    include             /etc/nginx/snippets/ssl.conf;

    # Next.js immutable build assets — let the browser cache them hard.
    location /_next/static/ {
        set $docsystem_web web:5200;
        proxy_pass http://$docsystem_web;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        set $docsystem_web web:5200;
        proxy_pass http://$docsystem_web;
        include    /etc/nginx/snippets/proxy.conf;
    }
}
