# Port 80 for every domain: serve the Let's Encrypt ACME HTTP-01 challenge over plain HTTP, and send
# all other traffic to HTTPS. This block must keep working even before certs exist (it references no
# cert), which is what lets certbot obtain the first certificate.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name yuristsystem.uz www.yuristsystem.uz dashboard.yuristsystem.uz api.yuristsystem.uz;

    # certbot --webroot writes the challenge files here; this path is a shared volume with the certbot
    # container (see docker-compose.yml: certbot_www).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else is permanently HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}
