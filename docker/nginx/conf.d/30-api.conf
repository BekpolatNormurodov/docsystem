# api.yuristsystem.uz — the programmatic/API origin. It reaches the SAME Next.js app: the app's HTTP
# endpoints are spread across /api/*, /konveyer/*, /settings/*, /jurnal/* (not a single prefix), so this
# host proxies everything rather than filtering by path — filtering would silently drop /konveyer/*.
# Requests carry the domain-wide session cookie, so same-origin browser calls just work; cross-origin
# callers need the CORS headers below (reflected only for *.yuristsystem.uz).
map $http_origin $docsystem_cors_origin {
    default                                  "";
    "~^https://([a-z0-9-]+\.)?yuristsystem\.uz$" $http_origin;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.yuristsystem.uz;

    ssl_certificate     /etc/letsencrypt/live/yuristsystem.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yuristsystem.uz/privkey.pem;
    include             /etc/nginx/snippets/ssl.conf;

    location / {
        # CORS for first-party (*.yuristsystem.uz) callers; credentials allowed for the shared cookie.
        add_header Access-Control-Allow-Origin      $docsystem_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
        add_header Vary                             "Origin" always;

        # Preflight: answer at the edge, don't forward.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $docsystem_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://docsystem_web;
        include    /etc/nginx/snippets/proxy.conf;
    }
}
