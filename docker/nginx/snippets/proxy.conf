# Shared reverse-proxy directives for every HTTPS server block. `$host` is forwarded verbatim so the
# app sees the real domain (needed for the domain-wide auth cookie) and X-Forwarded-Proto tells it the
# original request was HTTPS even though the edge->app hop is plain HTTP.
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        $connection_upgrade;

# Heavy synchronous work (single-case PDF render, big ZIP streaming) can run long — don't cut it off.
proxy_connect_timeout 30s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;

# Stream large ZIP/PDF downloads straight through instead of buffering the whole body to a temp file.
proxy_buffering off;
proxy_request_buffering off;
