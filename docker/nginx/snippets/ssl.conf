# Shared TLS hardening for every :443 server. Modern, broadly-compatible defaults (Mozilla
# "intermediate"): TLS 1.2/1.3 only, forward-secret ciphers, session reuse, and HSTS.
ssl_protocols              TLSv1.2 TLSv1.3;
ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers  off;
ssl_session_cache          shared:SSL:10m;
ssl_session_timeout        1d;
ssl_session_tickets        off;

# Tell browsers to stick to HTTPS for two years. Sent on every HTTPS response; during the brief
# dummy-cert bootstrap the browser rejects the self-signed cert before storing this, so it's a no-op then.
add_header Strict-Transport-Security "max-age=63072000" always;
# Minor hardening headers (safe defaults for an internal tool).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
