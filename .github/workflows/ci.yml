name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: docsystem_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/docsystem_test"
      AUTH_SECRET: "ci-secret-not-used-in-prod-min-32-chars-000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate --accept-data-loss
      - run: npm test

  docker-build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image (lean, chromium-free)
        run: docker build -f Dockerfile -t docsystem-web:ci .
      - name: Build worker image (Playwright)
        run: docker build -f Dockerfile.worker -t docsystem-worker:ci .
